<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XDF Parts Finder</title>
<meta name="description" content="Offline search of WinGD X72DF-2.1 spare parts: OE part numbers, names and CMD/SAP material numbers.">
<meta name="theme-color" content="#0f1720">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XDF Parts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#0f1720; --muted:#5b6672; --line:#dde3e9;
  --accent:#0b6bcb; --accent-ink:#ffffff; --chip:#eaf1fa; --sap:#0a7a45; --sap-bg:#e6f5ec;
  --warn:#8a4b00; --warn-bg:#fbefdf; --hl:#fff2a8; --err:#b42318;
  --scrim:rgba(0,0,0,.86); --track:#aeb9c4; --knob:#ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720; --card:#17212c; --ink:#e8edf2; --muted:#93a1af; --line:#263342;
    --accent:#4ea3ff; --accent-ink:#06121f; --chip:#1d2b3a; --sap:#5fd49a; --sap-bg:#123326;
    --warn:#ffb866; --warn-bg:#3a2a14; --hl:#5c4d00; --err:#ff8a80; --track:#3d4d60; --knob:#e8edf2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720; --card:#17212c; --ink:#e8edf2; --muted:#93a1af; --line:#263342;
  --accent:#4ea3ff; --accent-ink:#06121f; --chip:#1d2b3a; --sap:#5fd49a; --sap-bg:#123326;
  --warn:#ffb866; --warn-bg:#3a2a14; --hl:#5c4d00; --err:#ff8a80; --track:#3d4d60; --knob:#e8edf2;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
[hidden]{display:none !important}
#app,#lock{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding-block:calc(env(safe-area-inset-top, 0px) + 10px) 8px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 8px;font-weight:650;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1 small{font-weight:400;color:var(--muted);font-size:12px}
.search{position:relative}
input{font:inherit}
.search input{width:100%;font-size:17px;padding:12px 40px 12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--accent)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--muted);font-size:22px;width:34px;height:34px}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:6px 12px;font-size:14px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#status{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
main{padding-block:10px calc(env(safe-area-inset-bottom, 0px) + 24px);max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:10px}
.src{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.name{font-weight:650;font-size:16px;word-break:break-word}
.rem{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-word}
.ids{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.id{font:600 14px/1.2 ui-monospace,"SF Mono",Menlo,monospace;padding:6px 9px;border-radius:8px;
  background:var(--chip);border:0;color:var(--ink);text-align:left;cursor:pointer}
.id.sap{background:var(--sap-bg);color:var(--sap)}
.id .lbl{display:block;font:500 10px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;opacity:.8;letter-spacing:.02em;text-transform:uppercase;margin-bottom:2px}
.meta{margin-top:8px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.meta b{color:var(--ink);font-weight:600}
.grp{font-size:13px;margin-top:6px;word-break:break-word}
.fields{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 12px;margin-top:10px;font-size:14px;line-height:1.35}
.fl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.fv{min-width:0;word-break:break-word}
.sub{color:var(--muted);font-size:12px}
.card.exact{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sapsec{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.saph{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--sap);margin-bottom:2px}
.saprow{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.pair{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.pair .id{min-width:0;overflow-wrap:anywhere}
.id.none{color:var(--muted);cursor:default;font-weight:500}
.sapn{min-width:0;font-size:14px;word-break:break-word}
.sapsec .note{margin-top:8px}
.fv .note{margin-top:6px}
.card.special{border:2px solid var(--warn);background:linear-gradient(var(--warn-bg), var(--card) 70px)}
.tag.star{background:var(--warn);color:var(--card)}
.id.parker{background:var(--warn-bg);color:var(--warn)}
.pinh{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);margin:4px 0 8px}
.photo{display:block;width:100%;max-width:420px;margin-top:8px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);cursor:zoom-in}
.photo img{display:block;width:100%;height:auto}
#zoom{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
.tag{display:inline-block;font-size:11px;font-weight:650;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 7px;margin-bottom:6px}
.ln{font-size:13px;margin-top:4px;word-break:break-word}
.note{font-size:12px;margin-top:8px;padding:6px 8px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
.link{border:0;background:none;color:var(--accent);font-size:13px;padding:6px 0 0;cursor:pointer;text-align:left}
details{margin-top:6px;font-size:13px}
details summary{color:var(--accent);cursor:pointer}
details .ln{color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:3px}
.empty{color:var(--muted);text-align:center;padding:36px 10px}
.empty p{margin:6px 0}
.tip{font-size:13px}
.ex{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.ex button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--accent);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
footer{color:var(--muted);font-size:11px;text-align:center;padding-block:8px 6px;max-width:760px;margin:0 auto}
.offl{text-align:center;font-size:13px;line-height:1.4;color:var(--muted);max-width:760px;margin:0 auto;padding-block:6px calc(env(safe-area-inset-bottom, 0px) + 28px)}
.offl.ok{color:var(--sap);font-weight:600}
.offl.warn{color:var(--warn)}
.offl .upd{display:block;color:var(--accent);font-weight:600;margin-top:4px}
#lock{padding-block:18vh 24px}
.lockbox{width:100%;max-width:380px;margin:0 auto}
.lockbox h1{font-size:22px;display:block}
.lockbox p{color:var(--muted);font-size:15px}
.lockbox input{width:100%;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);letter-spacing:.06em;-webkit-appearance:none;appearance:none}
.lockbox button{width:100%;margin-top:10px;font-size:17px;padding:12px;border-radius:12px;border:0;
  background:var(--accent);color:var(--accent-ink);font-weight:600}
.lockbox .err{color:var(--err);min-height:20px}
.filters.wrap{flex-wrap:wrap;overflow:visible}
.opts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px}
.sw{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);font-size:14px;padding:3px 0;cursor:pointer}
.sw .track{flex:none;width:38px;height:22px;border-radius:999px;background:var(--track);position:relative;transition:background .15s}
.sw .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--knob);transition:transform .15s}
.sw[aria-checked="true"] .track{background:var(--accent)}
.sw[aria-checked="true"] .track::after{transform:translateX(16px)}
@media (prefers-reduced-motion: reduce){.sw .track,.sw .track::after{transition:none}}
.tag.mtag{background:var(--chip);color:var(--ink)}
.chain{display:flex;flex-direction:column;gap:6px;margin:6px 0 2px}
.chn{font-size:13px;line-height:1.4;padding:7px 9px;border-radius:8px;background:var(--chip);word-break:break-word}
.chl{color:var(--muted);margin-top:2px}
.chl i{font-style:normal;white-space:nowrap}
.chl b{font:600 12.5px/1.2 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink)}
.bom summary{font-size:14px;padding:4px 0}
.brow{display:grid;grid-template-columns:3em minmax(0,1fr);gap:2px 8px;align-items:start;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.brow.bhead{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-top:0;padding:6px 0 4px}
.bit{font:600 13px/1.9 ui-monospace,"SF Mono",Menlo,monospace;color:var(--muted)}
.id.bsap{font-size:13px;padding:4px 7px}
.bds{min-width:0;word-break:break-word;padding-top:4px}
.bomrows .more{margin-top:8px;padding:9px;font-size:14px}
.legend{max-width:760px;margin:4px auto 6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px;line-height:1.5}
.lgh{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.lgr{display:grid;grid-template-columns:8.4em minmax(0,1fr);gap:8px}
.offl .xl{display:block;color:var(--muted);font-weight:400;margin-top:3px}
.offl .xl.ok{color:var(--sap);font-weight:600}
</style>
</head>
<body>
<div id="lock" hidden>
  <div class="lockbox">
    <h1>XDF Parts Finder</h1>
    <p>Enter your access code. You only need to do this once on each device.</p>
    <form id="lockform">
      <input id="code" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="xxxx xxxx xxxx xxxx" aria-label="Access code">
      <button type="submit">Unlock</button>
    </form>
    <p id="lockmsg" class="err" role="alert"></p>
  </div>
</div>
<div id="app" hidden>
  <header>
    <h1>XDF Parts Finder <small id="count"></small></h1>
    <div class="search">
      <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        placeholder="Name, OE, SAP or CMD no." aria-label="Search parts">
      <button class="clear" id="clr" aria-label="Clear search" hidden>×</button>
    </div>
    <div class="filters" role="group" aria-label="Source">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="spc" aria-pressed="false">WinGD (OE)</button>
      <button data-f="yard" aria-pressed="false">Yard (CMD)</button>
      <button data-f="sap" aria-pressed="false">Other SAP</button>
      <button data-f="eq" aria-pressed="false" id="chipEq" hidden>Machines</button>
    </div>
    <div class="opts" id="opts" hidden>
      <button class="sw" id="optOther" type="button" role="switch" aria-checked="false" hidden><span class="track"></span>Other machinery</button>
      <button class="sw" id="optMach" type="button" role="switch" aria-checked="false" hidden><span class="track"></span>Machinery view</button>
    </div>
    <div id="status" aria-live="polite"></div>
  </header>
  <main id="out"></main>
  <div id="legend" class="legend" hidden>
    <div class="lgh">How SAP lists machinery</div>
    <div class="lgr"><b>Equipment</b><span>the machine</span></div>
    <div class="lgr"><b>→ BOM</b><span>its parts list</span></div>
    <div class="lgr"><b>→ Item no.</b><span>the line in the list</span></div>
    <div class="lgr"><b>→ Material no.</b><span>the actual part you order and keep in stock</span></div>
  </div>
  <footer id="foot"></footer>
  <div id="offline" class="offl" role="status" aria-live="polite"></div>
</div>
<div id="zoom" hidden><img id="zoomimg" alt=""></div>
<div id="toast"></div>

<script id="data" type="application/json">/*DATA*/</script>
<!--OTHER-->
<script>
(async function(){
"use strict";
const ENC = JSON.parse(document.getElementById('data').textContent);
const KEYNAME = 'xdf-parts-key-v1';
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u8 => btoa(String.fromCharCode.apply(null, Array.from(u8)));
function save(k, v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(_){} }
function load(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }

async function deriveRaw(code){
  const norm = code.toLowerCase().replace(/[^a-z0-9]/g, '');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, base, 256);
  return new Uint8Array(bits);
}
async function decrypt(raw){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
async function openBlob(u8){   // a separate data file: 12-byte IV, then AES-GCM of gzip(JSON), same key as the page
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8.slice(0, 12)}, key, u8.slice(12));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
function unlock(){
  return new Promise(resolve => {
    $('lock').hidden = false;
    const msg = t => { $('lockmsg').textContent = t; };
    if (!window.crypto || !crypto.subtle) msg('Open this page from its https:// address.');
    else if (typeof DecompressionStream === 'undefined') msg('Please update iOS (16.4 or newer is needed).');
    $('lockform').addEventListener('submit', async e => {
      e.preventDefault();
      msg('Checking…');
      try {
        const raw = await deriveRaw($('code').value);
        const d = await decrypt(raw);
        rawKey = raw;
        save(KEYNAME, toB64(raw));
        $('lock').hidden = true;
        resolve(d);
      } catch(_) { msg('That code did not work. Check it and try again.'); }
    });
  });
}

let D = null, rawKey = null;
const saved = load(KEYNAME);
if (saved){ try { rawKey = b64(saved); D = await decrypt(rawKey); } catch(_) { D = null; rawKey = null; save(KEYNAME, null); } }
if (!D) D = await unlock();
$('app').hidden = false;
if (window.xdfOfflineRefresh) window.xdfOfflineRefresh();

// ---------- data ----------
// systems:  [chapter no., name]  (chapters of the WinGD catalogue)
// chapters: [group, title, location, systemIdx, pdfFrom, pdfTo, pageFrom, pageTo]
// spc:   [chapterIdx, pos, oe, qty, level, name, remark, kg, assembly, pdfPage, printedPage]
// tools: [groupItem, cmd, drawing, description, qty, kg, page]
// pages: [listIdx, page, title, [lines], [cmd numbers], systemIdx or -1]
// oesap / cmdsap: {OE or CMD no.: [[SAP no., SAP description], ...]}   saprecs: [kindIdx, maker no., SAP no., SAP description, [SAP equipment names]]
const CH = D.chapters, LISTS = D.lists, SYS = D.systems || [], rows = [];
const OESAP = D.oesap || {}, CMDSAP = D.cmdsap || {}, SAPK = D.sapkinds || [];
for (const r of D.spc){ const c = CH[r[0]];
  rows.push({t:'spc', grp:c[0], title:c[1], sys:SYS[c[3]], pdfR:[c[4], c[5]], catR:[c[6], c[7]],
    pos:r[1], oe:r[2], qty:r[3], lvl:r[4], name:r[5], rem:r[6], kg:r[7], asm:r[8], pdf:r[9], pg:r[10], sap:OESAP[r[2]] || []}); }
for (const r of D.tools)
  rows.push({t:'tool', gi:r[0], cmd:r[1], dwg:r[2], name:r[3], qty:r[4], kg:r[5], page:r[6], sap:CMDSAP[r[1]] || []});
for (const r of D.pages)
  rows.push({t:'page', list:LISTS[r[0]], page:r[1], title:r[2], lines:r[3], cmds:r[4], sys:r[5] >= 0 ? SYS[r[5]] : null});
for (const s of (D.specials || []))
  rows.unshift({t:'special', tag:s.tag, name:s.title, sub:s.subtitle, oe:s.oe, parker:s.parker, label:s.label,
    details:s.details || [], manual:s.manual, sap:s.sap || [], extra:s.search || '', photo:s.photo || '', cap:s.photo_caption || ''});
for (const r of (D.saprecs || []))
  rows.push({t:'sap', k:r[0], kind:SAPK[r[0]], mk:r[1], sapno:r[2], name:r[3], eq:r[4] || []});

const norm = s => String(s == null ? '' : s).toLowerCase();
const squash = s => norm(s).replace(/[^a-z0-9\u4e00-\u9fff]/g, '');
// squash(), but with the first letter of every word in upper case. A search word made only of letters and
// typed without punctuation ("oring" for O-RING) must start where a word starts, so it cannot match inside
// another word ("mooring"). Words with digits (part numbers) may still match anywhere.
function squashB(s){
  let out = '', start = true;
  for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    if ((c >= 97 && c <= 122) || (c >= 48 && c <= 57) || (c >= 0x4e00 && c <= 0x9fff)){
      out += (start && c >= 97 && c <= 122) ? String.fromCharCode(c - 32) : s[i];
      start = false;
    } else start = true;
  }
  return out;
}
function wordStart(hay, i){
  const c = hay.charCodeAt(i - 1);
  return !((c >= 97 && c <= 122) || (c >= 48 && c <= 57) || (c >= 0x4e00 && c <= 0x9fff));
}
function squashHit(hayS, hayB, st, alpha){
  let i = hayS.indexOf(st);
  if (!alpha) return i >= 0;
  while (i >= 0){
    const c = hayB.charCodeAt(i);
    if (c >= 65 && c <= 90) return true;
    i = hayS.indexOf(st, i + 1);
  }
  return false;
}
const yardGroups = new Set(D.ygroups || []);
// SAP no. -> [maker part no. as SAP writes it, when that differs from the number the part is listed under
// (e.g. an OE no. with an ending such as -251), second maker no. when SAP holds a different one]
const SAPMK = Object.assign({}, D.sapmk || {});
const mkTxt = sap => { const m = SAPMK[sap]; return m ? ' ' + m[0] + ' ' + m[1] : ''; };
const sapTxt = l => l.map(s => s[0] + ' ' + s[1] + mkTxt(s[0])).join(' ');
function mkExact(r, st){      // the maker part no. typed exactly as SAP writes it
  const saps = r.sapno ? [r.sapno] : (r.sap || []).map(s => s[0]);
  return saps.some(s => { const m = SAPMK[s]; return !!m && ((!!m[0] && squash(m[0]) === st) || (!!m[1] && squash(m[1]) === st)); });
}
function hasSap(r, n){
  if (r.sapno) return r.sapno === n;
  if (r.sap && r.sap.some(s => s[0] === n)) return true;
  return !!(r.cmds && r.cmds.some(c => (CMDSAP[c] || []).some(s => s[0] === n)));
}
function index(r){
  let parts;
  if (r.t === 'spc') parts = [r.oe, r.name, r.rem, r.asm, r.grp, r.title, r.pos, r.sys ? r.sys[1] : '', sapTxt(r.sap)];
  else if (r.t === 'tool') parts = [r.cmd, r.dwg, r.name, r.gi, 'tool tools 50043150', sapTxt(r.sap)];
  else if (r.t === 'page') parts = [r.title, r.lines.join(' '), r.cmds.join(' '), r.list.id, r.cmds.map(n => sapTxt(CMDSAP[n] || [])).join(' ')];
  else if (r.t === 'special') parts = [r.name, r.sub, r.oe, r.parker, r.label, r.label.replace(/\s+/g, ''), r.details.join(' '), r.manual, sapTxt(r.sap), r.extra, r.tag];
  else if (r.t === 'eq') parts = [r.name, r.no, r.bom, 'machine equipment'];
  else parts = [r.mk, r.sapno, r.name, r.kind, r.eq.join(' '), mkTxt(r.sapno)];
  r.hay = norm(parts.join(' | '));
  r.hayB = squashB(r.hay);
  r.hayS = r.hayB.toLowerCase();
  return r;
}

// D.mach: [[equipment no., name, BOM no., [item no., SAP no., item no., SAP no., ...]]] for the main engine.

function addMachines(list, other, sapOf){
  for (const m of list){
    const e = {t:'eq', idx:EQS.length, no:m[0], name:m[1], bom:m[2], other, items:[]};
    for (let i = 0; i < m[3].length; i += 2){
      const sap = sapOf(m[3][i + 1]);
      e.items.push([m[3][i], sap]);
      let c = CHAIN.get(sap);
      if (!c) CHAIN.set(sap, c = []);
      c.push([e, m[3][i]]);
    }
    EQS.push(e);
    rows.push(index(e));
  }
}

const inMode = r => !(r.other && !OPT.other) && !(r.t === 'eq' && !OPT.mach);

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hl(text, toks){
  const s = esc(text);
  if (!toks.length) return s;
  const re = new RegExp('(' + toks.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return s.replace(re, '<mark>$1</mark>');
}
function search(q){
  const toks = norm(q).split(/\s+/).filter(Boolean);
  const res = [];
  for (const r of rows){
    if (!inMode(r)) continue;
    if (filter === 'spc' && r.t !== 'spc' && r.t !== 'special') continue;
    if (filter === 'yard' && r.t !== 'tool' && r.t !== 'page') continue;
    if (filter === 'sap' && r.t !== 'sap' && r.t !== 'special') continue;
    if (filter === 'eq' && r.t !== 'eq') continue;
    const more = OPT.other && r.hayO, hay = more ? r.hay + r.hayO : r.hay;
    const hayB = more ? r.hayB + r.hayOB : r.hayB, hayS = more ? r.hayS + r.hayOS : r.hayS;
    let ok = true, score = 0;
    for (const t of toks){
      const st = squash(t), alpha = /^[a-z]+$/.test(st);
      const i = hay.indexOf(t);
      let viaSquash = false;
      if (i === 0) score += 3;
      else if (i > 0) score += wordStart(hay, i) ? 2 : 1;          // a whole-word start ranks above a match inside a word
      else if (st.length >= 3 && squashHit(hayS, hayB, st, alpha)){ score += 2; viaSquash = true; }
      else { ok = false; break; }
      if (r.oe && squash(r.oe) === st) score += 60;
      if (r.cmd === t || (r.cmds && r.cmds.indexOf(t) >= 0)) score += 60;
      if (hasSap(r, t) || (r.mk && squash(r.mk) === st) || mkExact(r, st)) score += 60;
      if (r.parker && (squash(r.parker) === st || squash(r.label.replace(/\s*ELEMENT$/i, '')) === st)) score += 60;
      if (r.t === 'eq' && (r.no === t || r.bom === t)) score += 60;
      if ((r.grp && r.grp === t) || (r.gi && r.gi.indexOf(t) === 0)) score += 6;
      if (r.name){
        const nm = norm(r.name);
        if (nm.indexOf(t) >= 0) score += 2;
        else if (viaSquash){ const nb = squashB(nm); if (squashHit(nb.toLowerCase(), nb, st, alpha)) score += 2; }
      }
    }
    if (ok) res.push([score + (r.t === 'special' ? 100 : 0) + (r.t === 'eq' ? 40 : 0), r]);
  }
  res.sort((a, b) => b[0] - a[0]);
  return {toks, res: res.map(x => x[1])};
}

function syncOpts(){
  $('optOther').setAttribute('aria-checked', OPT.other ? 'true' : 'false');
  $('optMach').setAttribute('aria-checked', OPT.mach ? 'true' : 'false');
  $('chipEq').hidden = !OPT.mach;
  $('legend').hidden = !OPT.mach;
  document.querySelector('.filters').classList.toggle('wrap', OPT.mach);
}
function setMach(on){
  OPT.mach = on;
  save('xdf-opt-mach', on ? '1' : null);
  if (!on && filter === 'eq') setFilter('all');
  syncOpts(); shown = 50; render();
}
async function setOther(on){
  if (on && !otherData){
    OPT.other = true; syncOpts();
    $st.textContent = 'Loading other machinery…';
    if (!(await loadOther())){
      on = false;
      toast('Other machinery is not on this phone yet. Connect to the internet once.', 4500);
    }
  }
  OPT.other = on;
  save('xdf-opt-other', on ? '1' : null);
  syncOpts(); shown = 50; render(); bottom();
}

// ---------- other machinery: its own encrypted file, kept in its own cache ----------
// Removing the feature (tools/config.json, "other_machinery": false) drops D.meta.other; the page then
// hides the switch and deletes the stored file from the phone.
const OCACHE = 'xdf-other';
let otherData = null, otherBusy = null, otherState = OTHER ? 'checking' : 'none';
async function otherBytes(net){
  const inl = $('otherdata');
  if (inl) return b64(inl.textContent.trim());           // claude.ai view: the data is inside the page
  let c = null;
  try {
    c = await caches.open(OCACHE);
    const hit = await c.match(OTHER.file);
    if (hit){ const u8 = new Uint8Array(await hit.arrayBuffer()); if (u8.length === OTHER.bytes) return u8; }
  } catch(_) {}
  if (!net) return null;
  const resp = await fetch(OTHER.file);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const u8 = new Uint8Array(await resp.arrayBuffer());
  if (u8.length !== OTHER.bytes) throw new Error('incomplete download');
  if (c){
    try {
      await c.put(OTHER.file, new Response(u8, {headers: {'Content-Type': 'application/octet-stream'}}));
      for (const k of await c.keys()) if (!k.url.endsWith('/' + OTHER.file)) await c.delete(k);
    } catch(_) {}
  }
  return u8;
}
function loadOther(){
  if (otherData) return Promise.resolve(true);
  if (!otherBusy) otherBusy = (async () => {
    try {
      const u8 = await otherBytes(true);
      if (!u8) return false;
      const o = await openBlob(u8);                       // {eq: machines, mat: [[SAP no., description, maker no.]]}
      const mainSap = new Set(SAPINFO.keys()), shared = new Map();
      for (const m of o.mat) if (!mainSap.has(m[0])){ SAPINFO.set(m[0], [m[1], m[2]]); if (m[3]) SAPMK[m[0]] = ['', m[3]]; }
      addMachines(o.eq, true, i => o.mat[i][0]);
      for (const m of o.mat){
        const names = Array.from(new Set((CHAIN.get(m[0]) || []).filter(x => x[0].other).map(x => x[0].name)));
        if (mainSap.has(m[0])) shared.set(m[0], names);
        else rows.push(index({t:'sap', other:true, k:m[2] ? 3 : 4, kind:SAPK[m[2] ? 3 : 4] || 'Maker no.', mk:m[2], sapno:m[0], name:m[1], eq:names}));
      }
      if (shared.size) for (const r of rows){             // parts the main engine shares with other machines
        if (r.other || r.t === 'eq') continue;
        const saps = r.sapno ? [r.sapno] : r.sap ? r.sap.map(s => s[0]) : r.cmds ? [].concat(...r.cmds.map(c => (CMDSAP[c] || []).map(s => s[0]))) : [];
        const extra = Array.from(new Set([].concat(...saps.map(s => shared.get(s) || []))));
        if (extra.length){ r.eqO = extra; r.hayO = ' | ' + norm(extra.join(' ')); r.hayOB = squashB(r.hayO); r.hayOS = r.hayOB.toLowerCase(); }
      }
      otherData = o;
      otherState = $('otherdata') ? 'inline' : 'stored';
      return true;
    } catch(_) {
      try { await caches.delete(OCACHE); } catch(__) {}
      return false;
    } finally { otherBusy = null; }
  })();
  return otherBusy;
}
async function otherPrefetch(){   // store the file for offline use without opening it
  if (!OTHER || otherData) return;
  try { if (await otherBytes(false)){ otherState = $('otherdata') ? 'inline' : 'stored'; return bottom(); } } catch(_) {}
  if (navigator.onLine === false){ otherState = 'missing'; return bottom(); }
  otherState = 'downloading'; bottom();
  try { await otherBytes(true); otherState = 'stored'; } catch(_) { otherState = 'missing'; }
  bottom();
}
window.addEventListener('online', () => { if (otherState === 'missing') otherPrefetch(); });

// ---------- bottom lines: other machinery status and the page's last update ----------
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtTime(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear() + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
window.xdfMain = MAIN_N.toLocaleString() + ' entries';
window.xdfExtra = () => {
  let h = '';
  if (OTHER){
    const n = OTHER.eq.toLocaleString() + ' machines, ' + OTHER.lines.toLocaleString() + ' parts-list lines';
    const t = otherState === 'stored' ? '✓ Other machinery (' + n + ') is stored on this device.'
      : otherState === 'inline' ? 'Other machinery (' + n + ') is included in this page.'
      : otherState === 'downloading' ? 'Other machinery: downloading for offline use…'
      : otherState === 'missing' ? 'Other machinery is not on this device yet. Connect to the internet once.' : '';
    if (t) h += '<span class="xl' + (otherState === 'stored' ? ' ok' : '') + '">' + t + '</span>';
  }
  if (D.meta.builtAt) h += '<span class="xl">Page last updated: ' + esc(fmtTime(D.meta.builtAt)) + '</span>';
  return h;
};
function bottom(){ if (window.xdfOfflineRefresh) window.xdfOfflineRefresh(); }

// ---------- start ----------
$('opts').hidden = !(OTHER || HAS_MACH);
$('optOther').hidden = !OTHER;
$('optMach').hidden = !HAS_MACH;
syncOpts();
render();
bottom();
if (!OTHER){ save('xdf-opt-other', null); try { caches.delete(OCACHE).catch(() => {}); } catch(_) {} }
else if (OPT.other) setOther(true);
else otherPrefetch();
})();
(function offlineStatus(){
  const el = document.getElementById('offline');
  const set = (cls, html) => { el.className = 'offl ' + cls; el.innerHTML = html + (window.xdfExtra ? window.xdfExtra() : ''); };
  if (/claude\.ai|claudeusercontent/.test(location.hostname)){
    (window.xdfOfflineRefresh = () => set('', 'This view needs an internet connection. The app installed on the iPhone from GitHub Pages works offline.'))();
    return;
  }
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost')){
    (window.xdfOfflineRefresh = () => set('warn', 'Offline use is not available in this browser.'))();
    return;
  }
  let updateReady = false, hadController = !!navigator.serviceWorker.controller;
  const count = () => (window.xdfMain ? 'All ' + window.xdfMain + ' are' : 'All data is');
  async function cached(){
    try { return !!(await caches.match('./index.html', {ignoreSearch: true}) && await caches.match('./icon-192.png')); }
    catch(_) { return false; }
  }
  async function refresh(){
    const ok = await cached();
    const upd = updateReady ? '<span class="upd">Update downloaded. Close the app fully and open it again to use it.</span>' : '';
    if (ok) set('ok', '✓ Available offline. ' + count() + ' stored on this device.' +
      (navigator.onLine ? '' : ' You are offline now, using the stored copy.') + upd);
    else set('', (navigator.onLine ? 'Downloading for offline use…' : 'Not yet stored for offline use. Connect to the internet once.') + upd);
    return ok;
  }
  window.xdfOfflineRefresh = refresh;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const watch = w => { if (w) w.addEventListener('statechange', () => { if (w.state === 'activated') refresh(); }); };
    watch(reg.installing);
    reg.addEventListener('updatefound', () => watch(reg.installing));
  }).catch(() => set('warn', 'Offline use could not be set up in this browser.'));
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) updateReady = true; hadController = true; refresh(); });
  window.addEventListener('online', refresh);
  window.addEventListener('offline', refresh);
  let tries = 0;
  const timer = setInterval(async () => { if (await refresh() || ++tries > 40) clearInterval(timer); }, 1500);
  refresh();
})();
</script>
